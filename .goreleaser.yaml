version: 2

project_name: skillsync

before:
  hooks:
    - go mod tidy

builds:
  - id: skillsync
    main: ./cmd/skillsync
    binary: skillsync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rolfwessels/skillsync/internal/cli.Version={{.Version}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: skillsync
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}-v{{ .Version }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE.txt

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
